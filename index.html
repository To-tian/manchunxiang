<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Magic Holiday · 专属回忆</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Ma+Shan+Zheng&family=Long+Cang&family=Noto+Sans+SC:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; overflow: hidden; background-color: #0a0a0c; font-family: 'Segoe UI', sans-serif; touch-action: none; }
        canvas { position: fixed; top: 0; left: 0; z-index: 1; }

        #main-title {
            position: fixed; top: 20px; left: 0; width: 100%;
            text-align: center; z-index: 50; pointer-events: none; opacity: 0; transition: opacity 0.5s;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(180,150,100,0.4);
            font-size: 5rem; white-space: nowrap;
        }
        .style-xmas { background: linear-gradient(to bottom, #b89764, #8b7355); }
        .style-cny { background: linear-gradient(to bottom, #8b3a3a, #b89764); }

        #start-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a0c; z-index: 200; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #b89764;
            transition: opacity 0.8s;
        }
        #btn-start {
            padding: 15px 50px; font-size: 20px; background: linear-gradient(90deg, #8b7355, #6b533a);
            border: none; border-radius: 30px; color: #0a0a0c; font-weight: bold; cursor: pointer;
            box-shadow: 0 0 30px rgba(180,150,100,0.4); margin-top: 30px;
            -webkit-tap-highlight-color: transparent;
        }

        #photo-modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            max-width: 85%; max-height: 80%; background: #1a1a1a; padding: 10px 10px 40px 10px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.9); z-index: 150;
            opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 4px; border: 1px solid #444;
        }
        #photo-modal.active { opacity: 1; transform: translate(-50%, -50%) scale(1) rotate(-2deg); }
        #photo-modal img { max-width: 100%; max-height: 65vh; display: block; }
        #photo-caption { text-align: center; color: #b89764; font-family: 'Great Vibes', cursive; font-size: 2rem; margin-top: 8px; }

        #input_video {
            position: fixed; bottom: 20px; left: 20px;
            width: 140px; height: 105px; border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transform: scaleX(-1); z-index: 90; object-fit: cover;
            transition: opacity 0.5s;
        }
        #input_video.hidden-cam { opacity: 0; pointer-events: none; }

        #toggle-btn {
            position: fixed; top: 20px; right: 20px; width: 40px; height: 40px;
            background: rgba(255,255,255,0.08); border-radius: 50%; color: #b89764;
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer; z-index: 101;
            display: flex; justify-content: center; align-items: center; font-size: 18px;
        }

        #ui-panel {
            position: fixed; top: 70px; right: 20px; width: 260px;
            max-height: 70vh; overflow-y: auto;
            background: rgba(10,10,12,0.92); backdrop-filter: blur(15px);
            padding: 18px; border-radius: 12px; color: #b89764;
            border: 1px solid rgba(255,255,255,0.1); z-index: 100;
            transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            box-shadow: -5px 0 20px rgba(0,0,0,0.7);
            font-size: 13px;
        }
        #ui-panel.hidden { transform: translateX(130%); }

        .control-section { border-bottom: 1px dashed rgba(180,150,100,0.2); padding-bottom: 12px; margin-bottom: 12px; }
        .control-section:last-child { border-bottom: none; }
        .control-group { margin-bottom: 8px; }
        .control-group label { display: flex; justify-content: space-between; font-size: 11px; color: #bba180; margin-bottom: 4px; }
        input[type=range] { width: 100%; accent-color: #b89764; }
        input[type=text] { width: 100%; padding: 6px; background: rgba(0,0,0,0.3); border: 1px solid #444; color: #b89764; border-radius: 4px; font-size: 13px; }
        select { width: 100%; padding: 5px; background: #222; border: 1px solid #444; color: #fff; border-radius: 4px; }
        .btn { width: 100%; padding: 7px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2); color: #b89764; cursor: pointer; border-radius: 6px; font-size: 12px; }
        .btn.active { background: linear-gradient(90deg, #8b3a3a, #5a2020); }
        h3 { margin: 0 0 8px 0; font-size: 13px; color: #b89764; }

        @media (max-width: 600px) {
            #main-title { font-size: 3rem !important; }
            #ui-panel { width: 240px; }
        }
    </style>
</head>
<body class="bg-black">

    <div id="main-title" class="style-xmas">专属回忆</div>

    <div id="start-screen">
        <h1 style="font-family: 'Great Vibes'; font-size: 3.5rem; color: #b89764; margin: 0;">Magic Holiday</h1>
        <div style="margin-top:20px; text-align:center; color:#bba180; font-size:15px; line-height:1.8;">
            ⬅️ 左手 · 控制爆炸 &nbsp;|&nbsp; ➡️ 右手 · 捏合取图
        </div>
        <button id="btn-start">✨ 开启回忆之旅</button>
    </div>

    <div id="photo-modal">
        <img id="modal-img" src="" alt="Memory">
        <div id="photo-caption">Sweet Memory</div>
    </div>

    <button id="toggle-btn">⚙️</button>
    <video id="input_video" class="hidden-cam" autoplay playsinline muted></video>

    <div id="ui-panel">
        <div class="control-group">
            <button id="btn-fullscreen" class="btn">⛶ 全屏模式</button>
        </div>

        <div class="control-section">
            <h3>📝 文字自定义</h3>
            <div class="control-group">
                <label>标题内容</label>
                <input type="text" id="custom-text" value="专属回忆">
            </div>
            <div class="control-group">
                <label>字体大小 <span id="val-font-size">5.0</span>rem</label>
                <input type="range" id="font-size" min="2.0" max="10.0" step="0.5" value="5.0">
            </div>
            <div class="control-group">
                <label>选择字体</label>
                <select id="font-family">
                    <option value="'Great Vibes', cursive">Great Vibes (英/手写)</option>
                    <option value="'Ma Shan Zheng', cursive">马善政 (中/毛笔)</option>
                    <option value="'Long Cang', cursive">龙苍 (中/草书)</option>
                    <option value="'Noto Sans SC', sans-serif">思源黑体 (中/粗体)</option>
                    <option value="'Segoe UI', sans-serif">系统默认 (简洁)</option>
                </select>
            </div>
        </div>

        <div class="control-section">
            <h3>🎨 风格与场景</h3>
            <div class="control-group" style="display:flex; gap:10px;">
                <button id="theme-xmas" class="btn active">🎄 圣诞</button>
                <button id="theme-cny" class="btn">🧧 新春</button>
            </div>
            <div class="control-group">
                <label>背景颜色</label>
                <select id="bg-select">
                    <option value="black">🌌 纯黑</option>
                    <option value="deep">🌃 深邃</option>
                    <option value="warm">🔥 暖冬</option>
                    <option value="aurora">❄️ 极光</option>
                    <option value="china">🧧 中国红</option>
                </select>
            </div>
        </div>

        <div class="control-section">
            <h3>🎵 音乐与照片</h3>
            <div class="control-group">
                <label>背景音乐</label>
                <div style="display:flex; gap:8px; margin-top:5px;">
                    <button id="btn-play-pause" class="btn" style="width:40px;">⏸</button>
                    <input type="range" id="volume-slider" min="0" max="1" step="0.1" value="0.6" style="flex:1;">
                </div>
            </div>
            <div class="control-group">
                <button id="btn-toggle-cam" class="btn">📹 显示/隐藏 摄像头</button>
            </div>
        </div>

        <div class="control-section">
            <h3>🎛️ 参数调节</h3>
            <div class="control-group">
                <label>旋转速度 <span id="val-rot">0.002</span></label>
                <input type="range" id="rot-speed" min="0" max="0.02" step="0.001" value="0.002">
            </div>
            <div class="control-group">
                <label>树的高度</label>
                <input type="range" id="tree-height" min="40" max="100" step="5" value="70">
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size; attribute vec3 customColor; attribute vec3 spherePos; attribute float type;
        varying vec3 vColor; varying float vType;
        uniform float uTime; uniform float uExplosion; uniform float uBeat;
        void main() {
            vColor = customColor; vType = type;
            float t = uExplosion;
            float ease = 1.0 - pow(1.0 - t, 3.0);
            vec3 finalPos = mix(position, spherePos, ease);
            vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
            float s = size;
            gl_PointSize = s * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>
    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform float uTime; uniform float uBeat;
        varying vec3 vColor; varying float vType;
        void main() {
            vec2 coord = gl_PointCoord - vec2(0.5);
            if(length(coord) > 0.5) discard;
            gl_FragColor = vec4(vColor, 0.9);
        }
    </script>

    <script>
        // ========== 固定资源列表 ==========
        const MY_PHOTOS = [
            'photo1.jpg', 'photo2.jpg', 'photo3.jpg',
            'photo4.jpg', 'photo5.jpg', 'photo6.jpg',
            'photo7.jpg', 'photo8.jpg', 'photo9.jpg',
            'photo10.jpg', 'photo11.jpg', 'photo12.jpg'
        ];
        const MY_MUSIC = 'bgm.mp3';
        // ================================

        const state = {
            explosion: 0.0, targetExplosion: 0.0, photoActive: false,
            treeHeight: 70, rotationSpeed: 0.002, style: 'xmas'
        };

        let scene, camera, renderer, clock;
        let particleSystem, treeGroup, topDecoration;
        let photoMeshes = [], loadedImages = [];
        let audioCtx, analyser, dataArray, audioEl;

        document.getElementById('btn-start').addEventListener('click', () => {
            const screen = document.getElementById('start-screen');
            screen.style.opacity = 0;
            setTimeout(() => screen.remove(), 1000);
            document.getElementById('main-title').style.opacity = 1;
            document.getElementById('input_video').classList.remove('hidden-cam');
            initAudio();
            loadFixedPhotos();
            initThree();
            setupUI();
            startHandTracking();
        });

        function initAudio() {
            audioEl = new Audio();
            audioEl.loop = true;
            audioEl.src = MY_MUSIC;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            const source = audioCtx.createMediaElementSource(audioEl);
            source.connect(analyser);
            analyser.connect(audioCtx.destination);
            audioEl.play().then(() => {
                document.getElementById('btn-play-pause').innerText = '⏸';
            }).catch(e => console.log('自动播放需用户交互:', e));
        }

        function loadFixedPhotos() {
            if (MY_PHOTOS.length === 0) return;
            loadedImages = [];
            MY_PHOTOS.forEach(url => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => {
                    loadedImages.push(img);
                    if (loadedImages.length === MY_PHOTOS.length) {
                        updatePhotos();
                        console.log('所有照片加载完成');
                    }
                };
                img.onerror = () => console.warn('照片加载失败:', url);
                img.src = url;
            });
        }

        function initThree() {
            clock = new THREE.Clock();
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000000, 0.004);
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 30, 90);
            camera.lookAt(0, 30, 0);
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.body.appendChild(renderer.domElement);
            treeGroup = new THREE.Group();
            scene.add(treeGroup);

            createParticles();
            createTopObject();
            createSnow();
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createParticles() {
            if (particleSystem) {
                treeGroup.remove(particleSystem);
                particleSystem.geometry.dispose();
            }
            const isMobile = /Mobi|Android|iPhone/i.test(navigator.userAgent);
            const count = isMobile ? 8000 : 18000; // 移动端降低粒子数
            const geo = new THREE.BufferGeometry();
            const positions = [], spherePos = [], colors = [], sizes = [], types = [];
            const h = state.treeHeight;
            const colorHelper = new THREE.Color();

            const darkGold = 0x8b7355, copper = 0x8c5a45, deepRed = 0x5a2020;
            const mossGreen = 0x3a4a2a, darkBurgundy = 0x4a1520;

            for (let i = 0; i < count; i++) {
                const y = (i / count) * h;
                const rBase = (1 - y / h) * (h * 0.4);
                const angle = i * 0.2;
                const r = rBase * Math.sqrt(Math.random());
                positions.push(Math.cos(angle) * r, y - 10, Math.sin(angle) * r);

                const v = new THREE.Vector3(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).normalize();
                v.multiplyScalar(40 + Math.random() * 50);
                spherePos.push(v.x, v.y + 20, v.z);

                const rnd = Math.random();
                let type = 0;
                if (state.style === 'cny') {
                    if (rnd > 0.95) { type = 2; sizes.push(4); colorHelper.setHex(darkGold); }
                    else if (rnd > 0.85) { type = 1; sizes.push(5); colorHelper.setHex(deepRed); }
                    else { type = 0; sizes.push(1.5); colorHelper.setHex(Math.random() > 0.5 ? darkBurgundy : copper); }
                } else {
                    if (rnd > 0.96) { type = 2; sizes.push(4); colorHelper.setHex(copper); }
                    else if (rnd > 0.92) { type = 1; sizes.push(3); colorHelper.setHex(Math.random() > 0.5 ? deepRed : darkGold); }
                    else { type = 0; sizes.push(1.5); colorHelper.setHex(mossGreen); }
                }
                types.push(type);
                colors.push(colorHelper.r, colorHelper.g, colorHelper.b);
            }

            geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geo.setAttribute('spherePos', new THREE.Float32BufferAttribute(spherePos, 3));
            geo.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geo.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
            geo.setAttribute('type', new THREE.Float32BufferAttribute(types, 1));

            state.uniforms = { uTime: { value: 0 }, uExplosion: { value: 0 }, uBeat: { value: 0 } };
            const mat = new THREE.ShaderMaterial({
                uniforms: state.uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });
            particleSystem = new THREE.Points(geo, mat);
            treeGroup.add(particleSystem);
        }

        function createTopObject() {
            if (topDecoration) { treeGroup.remove(topDecoration); }
            if (state.style === 'xmas') {
                const s = new THREE.Shape();
                const p = 5;
                for (let i = 0; i < p * 2; i++) {
                    const r = (i % 2 === 0) ? 4 : 2;
                    const a = i / p * Math.PI;
                    s.lineTo(Math.cos(a) * r, Math.sin(a) * r);
                }
                const g = new THREE.ExtrudeGeometry(s, { depth: 1, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.2 });
                topDecoration = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0xb89764 }));
            } else {
                topDecoration = new THREE.Group();
                const sphere = new THREE.Mesh(new THREE.SphereGeometry(3.5, 32, 32), new THREE.MeshBasicMaterial({ color: 0x8b3a3a }));
                sphere.scale.set(1, 0.8, 1);
                const cap1 = new THREE.Mesh(new THREE.CylinderGeometry(2, 2, 0.5, 32), new THREE.MeshBasicMaterial({ color: 0xb89764 }));
                cap1.position.y = 2.6;
                const cap2 = cap1.clone(); cap2.position.y = -2.6;
                const t1 = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 8, 8), new THREE.MeshBasicMaterial({ color: 0x6b3a2a }));
                t1.position.set(0, -6, 0);
                const t2 = t1.clone(); t2.position.set(1, -6, 0); t2.rotation.z = 0.2;
                const t3 = t1.clone(); t3.position.set(-1, -6, 0); t3.rotation.z = -0.2;
                topDecoration.add(sphere, cap1, cap2, t1, t2, t3);
            }
            topDecoration.position.y = state.treeHeight;
            treeGroup.add(topDecoration);
        }

        function createSnow() {
            const g = new THREE.BufferGeometry();
            const pos = [];
            for (let i = 0; i < 800; i++) pos.push((Math.random() - 0.5) * 200, Math.random() * 150, (Math.random() - 0.5) * 200);
            g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
            window.snowSystem = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xcccccc, size: 0.6, transparent: true, opacity: 0.4 }));
            scene.add(window.snowSystem);
        }

        function updatePhotos() {
            photoMeshes.forEach(m => treeGroup.remove(m));
            photoMeshes = [];
            if (loadedImages.length === 0) return;
            loadedImages.forEach(img => {
                const cvs = document.createElement('canvas');
                cvs.width = 256; cvs.height = 256;
                const ctx = cvs.getContext('2d');
                ctx.beginPath(); ctx.arc(128, 128, 120, 0, Math.PI * 2); ctx.clip();
                const asp = img.width / img.height;
                if (asp > 1) ctx.drawImage(img, (img.width - img.height) / 2, 0, img.height, img.height, 0, 0, 256, 256);
                else ctx.drawImage(img, 0, (img.height - img.width) / 2, img.width, img.width, 0, 0, 256, 256);
                ctx.lineWidth = 10; ctx.strokeStyle = state.style === 'cny' ? '#b89764' : '#8c5a45'; ctx.stroke();
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(6, 6),
                    new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(cvs), side: THREE.DoubleSide, transparent: true })
                );
                const y = Math.random() * (state.treeHeight * 0.8);
                const r = (1 - y / state.treeHeight) * (state.treeHeight * 0.4) + 2;
                const a = Math.random() * Math.PI * 2;
                const origin = new THREE.Vector3(Math.cos(a) * r, y - 10, Math.sin(a) * r);
                const explodeDir = origin.clone().normalize().multiplyScalar(40 + Math.random() * 30);
                explodeDir.y += 20;
                mesh.position.copy(origin);
                mesh.userData = { origin: origin, explodePos: explodeDir, imgSrc: img.src };
                treeGroup.add(mesh);
                photoMeshes.push(mesh);
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (state.uniforms) {
                state.uniforms.uTime.value = t;
                state.uniforms.uBeat.value = 0.0;
                state.explosion += (state.targetExplosion - state.explosion) * 0.05;
                state.uniforms.uExplosion.value = state.explosion;
            }

            const ease = 1.0 - Math.pow(1.0 - state.explosion, 3.0);
            photoMeshes.forEach(p => {
                p.position.lerpVectors(p.userData.origin, p.userData.explodePos, ease);
                p.lookAt(camera.position);
                p.rotation.z += 0.005 * (1 + state.explosion * 5);
            });

            treeGroup.rotation.y += state.rotationSpeed + state.explosion * 0.01;

            if (topDecoration) {
                if (state.style === 'xmas') topDecoration.rotation.y -= 0.02;
                else topDecoration.rotation.z = Math.sin(t * 2) * 0.1;
                topDecoration.scale.set(1, 1, 1);
            }
            if (window.snowSystem) {
                const pos = window.snowSystem.geometry.attributes.position.array;
                for (let i = 1; i < pos.length; i += 3) {
                    pos[i] -= 0.25;
                    if (pos[i] < -20) pos[i] = 100;
                }
                window.snowSystem.geometry.attributes.position.needsUpdate = true;
            }
            renderer.render(scene, camera);
        }

        function startHandTracking() {
            const video = document.getElementById('input_video');
            const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });
            hands.onResults(results => {
                let leftFound = false;
                if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                    for (let i = 0; i < results.multiHandedness.length; i++) {
                        const label = results.multiHandedness[i].label;
                        const lm = results.multiHandLandmarks[i];
                        if (label === 'Left') {
                            leftFound = true;
                            const d = Math.hypot(lm[4].x - lm[20].x, lm[4].y - lm[20].y);
                            state.targetExplosion = Math.min(Math.max((d - 0.15) * 4, 0), 1);
                        }
                        if (label === 'Right') {
                            const pinchDist = Math.hypot(lm[4].x - lm[8].x, lm[4].y - lm[8].y);
                            if (pinchDist < 0.05) {
                                if (!state.photoActive) {
                                    showRandomPhoto();
                                    state.photoActive = true;
                                }
                            } else if (pinchDist > 0.08) {
                                if (state.photoActive) {
                                    document.getElementById('photo-modal').classList.remove('active');
                                    state.photoActive = false;
                                }
                            }
                        }
                    }
                }
                if (!leftFound) state.targetExplosion = 0;
            });

            const cameraUtils = new Camera(video, {
                onFrame: async () => { await hands.send({ image: video }); },
                width: 320,
                height: 240
            });
            cameraUtils.start();
        }

        function showRandomPhoto() {
            if (loadedImages.length === 0) return;
            const img = loadedImages[Math.floor(Math.random() * loadedImages.length)];
            document.getElementById('modal-img').src = img.src;
            document.getElementById('photo-modal').classList.add('active');
        }

        function setupUI() {
            document.getElementById('btn-fullscreen').addEventListener('click', () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                } else {
                    document.exitFullscreen();
                }
            });
            document.getElementById('btn-toggle-cam').addEventListener('click', () => {
                document.getElementById('input_video').classList.toggle('hidden-cam');
            });
            document.getElementById('bg-select').addEventListener('change', (e) => {
                document.body.className = 'bg-' + e.target.value;
            });
            document.getElementById('toggle-btn').addEventListener('click', () => {
                document.getElementById('ui-panel').classList.toggle('hidden');
            });
            document.getElementById('rot-speed').addEventListener('input', (e) => {
                state.rotationSpeed = parseFloat(e.target.value);
                document.getElementById('val-rot').innerText = state.rotationSpeed.toFixed(3);
            });
            document.getElementById('btn-play-pause').addEventListener('click', () => {
                if (audioEl.paused) {
                    audioEl.play();
                    document.getElementById('btn-play-pause').innerText = '⏸';
                } else {
                    audioEl.pause();
                    document.getElementById('btn-play-pause').innerText = '▶';
                }
            });
            document.getElementById('volume-slider').addEventListener('input', (e) => {
                audioEl.volume = parseFloat(e.target.value);
            });
            document.getElementById('tree-height').addEventListener('input', (e) => {
                state.treeHeight = parseInt(e.target.value);
                createParticles();
                if (topDecoration) topDecoration.position.y = state.treeHeight;
            });

            const titleEl = document.getElementById('main-title');
            const textInput = document.getElementById('custom-text');
            const sizeInput = document.getElementById('font-size');
            const fontSelect = document.getElementById('font-family');

            textInput.addEventListener('input', (e) => titleEl.innerText = e.target.value);
            sizeInput.addEventListener('input', (e) => {
                titleEl.style.fontSize = e.target.value + 'rem';
                document.getElementById('val-font-size').innerText = e.target.value;
            });
            fontSelect.addEventListener('change', (e) => titleEl.style.fontFamily = e.target.value);

            const switchTheme = (type) => {
                state.style = type;
                if (type === 'xmas') {
                    titleEl.innerText = '专属回忆';
                    titleEl.className = 'style-xmas';
                    titleEl.style.fontFamily = "'Great Vibes', cursive";
                    textInput.value = '专属回忆';
                    fontSelect.value = "'Great Vibes', cursive";
                    document.body.className = 'bg-black';
                    document.getElementById('bg-select').value = 'black';
                    document.getElementById('theme-xmas').classList.add('active');
                    document.getElementById('theme-cny').classList.remove('active');
                } else {
                    titleEl.innerText = '新春快乐';
                    titleEl.className = 'style-cny';
                    titleEl.style.fontFamily = "'Ma Shan Zheng', cursive";
                    textInput.value = '新春快乐';
                    fontSelect.value = "'Ma Shan Zheng', cursive";
                    document.body.className = 'bg-china';
                    document.getElementById('bg-select').value = 'china';
                    document.getElementById('theme-cny').classList.add('active');
                    document.getElementById('theme-xmas').classList.remove('active');
                }
                titleEl.style.fontSize = '5rem';
                sizeInput.value = '5.0';
                document.getElementById('val-font-size').innerText = '5.0';
                createParticles();
                createTopObject();
                if (loadedImages.length > 0) updatePhotos();
            };

            document.getElementById('theme-xmas').addEventListener('click', () => switchTheme('xmas'));
            document.getElementById('theme-cny').addEventListener('click', () => switchTheme('cny'));
        }
    </script>
</body>
</html>
